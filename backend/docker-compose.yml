# Local Postgres for development.
# Uses the pgvector image so semantic search (optional migration) works later
# without swapping the container.
#
#   docker compose up -d
#   npm run db:migrate
#
# Matches the default DATABASE_URL in .env.example.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai_search_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: search
      POSTGRES_PASSWORD: search
      POSTGRES_DB: ai_search
    ports:
      # Host port is overridable (set POSTGRES_PORT=5433 if 5432 is taken by a
      # local Postgres). Container always listens on 5432 internally.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U search -d ai_search']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
